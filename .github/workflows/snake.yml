name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   
  workflow_dispatch:         
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Muhammad-Tahaa-Awan
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6
            dist/github-contribution-grid-snake.svg?color_snake=#8B5CF6&color_dots=#EDE9FE,#C4B5FD,#A855F7,#7C3AED,#6D28D9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
